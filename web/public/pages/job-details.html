<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details - Resume AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary:        #4338ca;
            --primary-hover:  #3730a3;
            --primary-light:  #eef2ff;
            --primary-mid:    #6366f1;
            --accent:         #6366f1;
            --text-primary:   #0f172a;
            --text-secondary: #475569;
            --text-muted:     #94a3b8;
            --surface:        #ffffff;
            --bg:             #f8faff;
            --bg-hero:        linear-gradient(160deg,#eef2ff 0%,#f0f4ff 40%,#ffffff 100%);
            --border:         #e2e8f0;
            --border-strong:  #c7d2fe;
            --shadow-sm:      0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
            --shadow-md:      0 4px 16px rgba(67,56,202,.10), 0 2px 6px rgba(15,23,42,.05);
            --shadow-lg:      0 12px 32px rgba(67,56,202,.14), 0 4px 12px rgba(15,23,42,.06);
            --radius-sm:      8px;
            --radius-md:      12px;
            --radius-lg:      20px;
            --radius-xl:      28px;
            --font:           'Plus Jakarta Sans', system-ui, sans-serif;
            --transition:     200ms cubic-bezier(.4,0,.2,1);
        }
        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #2c3e50;
            line-height: 1.6;
        }

        nav {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-menu.hidden {
            display: none;
        }

        .user-menu-header {
            padding: 16px;
            border-bottom: 1px solid #e8eef5;
            color: #2c3e50;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 16px;
            border: none;
            background: none;
            color: #2c3e50;
            text-decoration: none;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .user-menu-item:hover {
            background: #f5f7fa;
            padding-left: 20px;
        }

        .user-menu-item.logout {
            color: #e74c3c;
            border-top: 1px solid #e8eef5;
            margin-top: 4px;
        }

        .container {
            width: min(1200px, calc(100% - 32px));
            margin: 48px auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 32px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            gap: 12px;
            color: #764ba2;
        }

        .job-header {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 32px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .job-title {
            font-size: 2.4rem;
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 12px;
        }

        .job-company {
            font-size: 1.2rem;
            color: #667eea;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .job-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 24px 0;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f5f7fa;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .meta-item:hover {
            background: #e8eef5;
            transform: translateY(-2px);
        }

        .meta-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            border-radius: 10px;
            font-size: 1.1rem;
        }

        .meta-text h4 {
            font-size: 0.85rem;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0;
        }

        .meta-text p {
            font-size: 1rem;
            font-weight: 700;
            color: #2c3e50;
            margin: 4px 0 0;
        }

        .job-actions {
            display: flex;
            gap: 16px;
            margin-top: 32px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #ffffff;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f5f7fa;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 32px;
        }

        .section {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i {
            color: #667eea;
            font-size: 1.3rem;
        }

        .description-text {
            color: #555;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .list-item {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8eef5;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item i {
            color: #667eea;
            min-width: 24px;
            margin-top: 2px;
        }

        .skill-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .skill-tag {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border: 1px solid #667eea30;
        }

        .skill-tag:hover {
            background: linear-gradient(135deg, #667eea25 0%, #764ba225 100%);
            transform: translateY(-2px);
        }

        .sidebar-section {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-title i {
            color: #667eea;
        }

        .salary-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
        }

        .salary-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .salary-value {
            font-size: 1.6rem;
            font-weight: 800;
            margin-top: 8px;
        }

        .company-info {
            padding: 16px;
            background: #f5f7fa;
            border-radius: 12px;
            margin-top: 16px;
        }

        .company-name {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .company-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #f39c12;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .job-meta {
                grid-template-columns: 1fr;
            }

            .job-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .job-title {
                font-size: 1.8rem;
            }

            .navbar-menu {
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>
<script src="/js/i18n.js"></script>
    <script src="/js/navbar.js"></script>
    <div class="container">
        <a href="/pages/job-listings.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Jobs
        </a>

        <!-- Job Header -->
        <div class="job-header" data-aos="fade-up">
            <div class="job-title" id="jobTitle">Loading…</div>
            <div class="job-company" id="jobCompany"></div>

            <div class="job-meta">
                <div class="meta-item" data-aos="fade-up" data-aos-delay="100">
                    <div class="meta-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <div class="meta-text">
                        <h4 data-i18n="details.location">Location</h4>
                        <p id="jobLocation">—</p>
                    </div>
                </div>

                <div class="meta-item" data-aos="fade-up" data-aos-delay="200">
                    <div class="meta-icon">
                        <i class="fas fa-briefcase"></i>
                    </div>
                    <div class="meta-text">
                        <h4 data-i18n="details.jobType">Job Type</h4>
                        <p id="jobType">—</p>
                    </div>
                </div>

                <div class="meta-item" data-aos="fade-up" data-aos-delay="300">
                    <div class="meta-icon">
                        <i class="fas fa-hourglass-start"></i>
                    </div>
                    <div class="meta-text">
                        <h4 data-i18n="details.posted">Posted</h4>
                        <p id="jobPosted">—</p>
                    </div>
                </div>

                <div class="meta-item" data-aos="fade-up" data-aos-delay="400">
                    <div class="meta-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="meta-text">
                        <h4 data-i18n="details.source">Source</h4>
                        <p id="jobApplicants">—</p>
                    </div>
                </div>
            </div>

            <div class="job-actions">
                <a class="btn btn-primary" id="applyBtn" href="#" target="_blank" rel="noopener" style="display:none">
                    <i class="fas fa-paper-plane"></i> <span data-i18n="details.applyOriginal">Apply on original posting</span>
                </a>
                <button class="btn btn-secondary" id="saveBtn">
                    <i class="fas fa-bookmark"></i> <span data-i18n="common.save">Save</span>
                </button>
                <button class="btn btn-secondary">
                    <i class="fas fa-share-alt"></i> Share
                </button>
            </div>
        </div>

        <!-- Content Grid -->
        <div class="content-grid">
            <!-- Main Content -->
            <div>
                <!-- Job Description -->
                <div class="section" data-aos="fade-up">
                    <h2 class="section-title">
                        <i class="fas fa-file-alt"></i> <span data-i18n="details.description">Job Description</span>
                    </h2>
                    <p class="description-text" id="jobDescription">Loading…</p>
                </div>

                <!-- Posting info (source + dates come from the real feed) -->
                <div class="section" data-aos="fade-up" data-aos-delay="100">
                    <h2 class="section-title">
                        <i class="fas fa-link"></i> <span data-i18n="details.postingInfo">Posting Info</span>
                    </h2>
                    <div class="list-item">
                        <i class="fas fa-database"></i>
                        <div><span data-i18n="details.source">Source</span>: <span id="jobSource">—</span></div>
                    </div>
                    <div class="list-item">
                        <i class="fas fa-calendar"></i>
                        <div><span data-i18n="details.postedOn">Posted</span>: <span id="jobPostedDate">—</span></div>
                    </div>
                    <div class="list-item">
                        <i class="fas fa-external-link-alt"></i>
                        <div><a id="jobOriginalLink" href="#" target="_blank" rel="noopener" data-i18n="details.openOriginal">Open original posting</a></div>
                    </div>
                </div>

                <!-- Skills -->
                <div class="section" data-aos="fade-up" data-aos-delay="300">
                    <h2 class="section-title">
                        <i class="fas fa-code"></i> <span data-i18n="details.tags">Tags</span>
                    </h2>
                    <div class="skill-tags" id="jobTags"></div>
                </div>
            </div>

            <!-- Sidebar -->
            <div>
                <!-- Salary -->
                <div class="sidebar-section" data-aos="fade-left">
                    <div class="salary-badge">
                        <div class="salary-label" data-i18n="details.salary">Salary</div>
                        <div class="salary-value" id="jobSalary">—</div>
                    </div>
                </div>

                <!-- Company Info -->
                <div class="sidebar-section" data-aos="fade-left" data-aos-delay="100">
                    <h3 class="sidebar-title">
                        <i class="fas fa-building"></i> <span data-i18n="details.company">Company</span>
                    </h3>
                    <div class="company-info">
                        <div class="company-name" id="jobCompanySide">—</div>
                    </div>
                    <p style="margin-top: 12px; color: #666; font-size: 0.9rem;" id="jobSourceNote" data-i18n="details.companyNote">
                        Company details come from the original posting.
                    </p>
                </div>

                <!-- Share -->
                <div class="sidebar-section" data-aos="fade-left" data-aos-delay="300">
                    <h3 class="sidebar-title">
                        <i class="fas fa-share-nodes"></i> Share This Job
                    </h3>
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px;">
                        <button style="padding: 12px; background: #3b5998; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1.2rem; transition: all 0.3s ease;" title="Facebook">
                            <i class="fab fa-facebook"></i>
                        </button>
                        <button style="padding: 12px; background: #1DA1F2; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1.2rem; transition: all 0.3s ease;" title="Twitter">
                            <i class="fab fa-twitter"></i>
                        </button>
                        <button style="padding: 12px; background: #0077b5; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1.2rem; transition: all 0.3s ease;" title="LinkedIn">
                            <i class="fab fa-linkedin"></i>
                        </button>
                        <button style="padding: 12px; background: #ea4c89; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1.2rem; transition: all 0.3s ease;" title="Email">
                            <i class="fas fa-envelope"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="/js/api.js"></script>
    <script>
        // Initialize AOS
        AOS.init({
            duration: 1000,
            once: true,
            offset: 100
        });
        // NOTE: navbar.js (shared component, loaded async) owns userBtn/userMenu
        // binding and user info. Nothing navbar-related is touched here so this
        // script can never die before loadJobDetails() runs.

        // Load job details from the real backend DB (no mock data).
        const T = window.T || ((k, fb) => (fb !== undefined ? fb : k));
        async function loadJobDetails() {
            const params = new URLSearchParams(window.location.search);
            const jobId = params.get('id');
            if (!jobId) {
                document.getElementById('jobTitle').textContent = T("details.noId", "Job not specified");
                document.getElementById('jobDescription').textContent = T("details.noIdSub", "Open this page from the Jobs list so a real posting id is provided.");
                return;
            }
            let job = null;
            try {
                const r = await fetch(Api.url(`/jobs/${encodeURIComponent(jobId)}`));
                if (r.ok) job = await r.json();
            } catch (e) { console.error(e); }
            if (!job || !job.title) {
                document.getElementById('jobTitle').textContent = T("details.notFound", "Job not found");
                document.getElementById('jobDescription').textContent = T("details.notFoundSub", "This posting is not in the database. Browse Jobs and refresh the real postings.");
                return;
            }

            const set = (id, v) => { document.getElementById(id).textContent = v || "—"; };
            set('jobTitle', job.title);
            set('jobCompany', job.company);
            set('jobCompanySide', job.company);
            set('jobLocation', job.location);
            set('jobType', job.type);
            set('jobSalary', job.salary);
            const posted = job.posted_at ? String(job.posted_at).slice(0, 10) : "";
            set('jobPosted', posted);
            set('jobApplicants', job.source || "");
            set('jobSource', job.source || "");
            set('jobPostedDate', posted);
            document.getElementById('jobSourceNote').textContent =
                `Fetched from ${job.source || "partner feed"} · saved ${String(job.fetched_at || "").slice(0, 10)}`;
            document.getElementById('jobDescription').textContent =
                job.description || T("common.noDescription", "No description provided by the source.");
            document.getElementById('jobTags').innerHTML =
                (job.tags || []).map(t => `<span class="skill-tag">${escapeHtml(t)}</span>`).join("");

            const link = document.getElementById('jobOriginalLink');
            const applyBtn = document.getElementById('applyBtn');
            if (job.url) {
                link.href = job.url;
                link.textContent = T("details.openOriginal", "Open original posting") + " ↗";
                applyBtn.href = job.url;
                applyBtn.style.display = "";
            } else {
                link.textContent = T("details.noLink", "No external link provided");
            }

            document.getElementById('saveBtn').addEventListener('click', async () => {
                try {
                    const user = JSON.parse(localStorage.getItem('user') || '{}');
                    if (!user.token) { alert(T("details.saveLogin", "Log in to save jobs to your account.")); return; }
                    const r = await fetch(Api.url(`/jobs/${encodeURIComponent(job.id)}/save`), {
                        method: "POST",
                        headers: { "Authorization": `Bearer ${user.token}` },
                    });
                    alert(r.ok ? T("details.saved", "Job saved!") : T("details.saveFail", "Could not save job."));
                } catch (e) { alert(T("details.saveFail", "Could not save job.")); }
            });
        }

        function escapeHtml(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;")
                .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        document.addEventListener('DOMContentLoaded', loadJobDetails);
        loadJobDetails();
    </script>
</body>
</html>
